plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://jitpack.io" }
    maven {
        url = uri("https://maven.parchmentmc.org/")
        content {
            includeGroup("org.parchmentmc.data")
        }
    }
    maven {
        url = uri("https://cursemaven.com")
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        name = "tterrag maven"
        url = uri("https://maven.tterrag.com/")
        content {
            includeGroup("com.jozufozu.flywheel")
        }
    }
    maven {
        name = "CreateMod Maven"
        url = uri("https://maven.createmod.net")
        content {
            includeGroup("dev.engine-room.flywheel")
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 requires Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // Mixin debug properties
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.checks.interfaces', 'true'

            // Force register lumenized mixin config in dev mode
            systemProperty 'mixin.configs', "${mod_id}.mixins.json"
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    sodiumOuter
}

def sodiumJar = layout.buildDirectory.file("extracted-mods/sodium.jar")
tasks.register("extractSodiumMod") {
    inputs.files(configurations.sodiumOuter)
    outputs.file(sodiumJar)
    doLast {
        def outer = configurations.sodiumOuter.singleFile
        def target = sodiumJar.get().asFile
        target.parentFile.mkdirs()
        def zip = new java.util.zip.ZipFile(outer)
        try {
                def hasSodiumClasses = zip.entries().any { it.name.startsWith("net/caffeinemc/mods/sodium/client/") && it.name.endsWith(".class") }
                def entry = zip.entries().find { it.name.startsWith("META-INF/jarjar/") && it.name.endsWith(".jar") && it.name.contains("sodium") && !it.name.endsWith("service.jar") }
                if (hasSodiumClasses || entry == null) {
                    // Some 0.6.x NeoForge builds are already the mod JAR.
                    target.bytes = outer.bytes
                } else {
                    target.bytes = zip.getInputStream(entry).bytes
                }
        } finally {
            zip.close()
        }
    }
}
dependencies {
    // Mixin & annotation processors
    // MixinExtras - 使用 compileOnly(annotationProcessor()) 统一语法
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    implementation "io.github.llamalad7:mixinextras-neoforge:${mixin_extras_version}"

    // Flywheel render engine (from CreateMod Maven)
    implementation "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${neoforge_flywheel_version}"

    // Sodium for NeoForge 1.21.1 (the Modrinth artifact is a wrapper with an inner mod JAR)
    sodiumOuter files("D:/document/dev/gradle/.gradle/caches/modules-2/files-2.1/maven.modrinth/sodium/mc1.21.1-0.6.13-neoforge/38af70fa4dc4b2aaac636e92fdba3bedd5a025e1/sodium-mc1.21.1-0.6.13-neoforge.jar")
    compileOnly files(sodiumJar)
    runtimeOnly files(sodiumJar)

    // Sodium's LevelSlice implements these Fabric API interfaces.  They are
    // supplied at runtime by Forgified Fabric API/Iris; keep them compile-only
    // here so Lumenized does not export duplicate classes into the JPMS layer.
    compileOnly files(
            "D:/document/dev/gradle/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-block-view-api-v2/1.0.3+924f046a77/b283a700f2110f4f2a6a5d70a81293cd77681c0a/fabric-block-view-api-v2-1.0.3+924f046a77.jar",
            "D:/document/dev/gradle/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-rendering-data-attachment-v1/0.3.39+92a0d36777/6d8e946691b66a01c4a826e0c4f6ccb0fc0d22ba/fabric-rendering-data-attachment-v1-0.3.39+92a0d36777.jar"
    )

    // Iris for NeoForge 1.21.1
    implementation "maven.modrinth:iris:${iris_version}"

    // JNA - RenderDoc support
    implementation "net.java.dev.jna:jna:${jna_version}"

    // JetBrains annotations
    implementation "org.jetbrains:annotations:24.0.1"

}


jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
    // 排除 Fabric API 桩接口，不打包进 JAR
    exclude 'net/fabricmc/**'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neoforge_version         : neoforge_version,
            neoforge_version_range   : neoforge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.register("validateGlslCompatibility") {
    def includeDir = file("src/main/resources/assets/minecraft/shaders/include")
    inputs.dir(includeDir)
    doLast {
        if (!includeDir.exists()) return
        def forbidden = [
                [name: "nested version directive", pattern: /(?m)^\s*#version\s+/],
                [name: "C-style float suffix", pattern: /\b\d+\.\d+f\b/],
                [name: "leading decimal literal", pattern: /(?<![0-9A-Za-z_.])\.[0-9]+/],
                [name: "legacy texture2D", pattern: /\btexture2D\s*\(/],
                [name: "legacy fragment output", pattern: /\bgl_FragColor\b/],
                [name: "legacy vertex qualifier", pattern: /\b(attribute|varying)\b/]
        ]
        fileTree(includeDir).matching { include "**/*.glsl" }.each { source ->
            def text = source.getText("UTF-8")
            forbidden.each { rule ->
                if (text.find(rule.pattern)) {
                    throw new GradleException("GLSL compatibility check failed in ${source}: ${rule.name}")
                }
            }
            def conditionalCount = text.findAll(/(?m)^\s*#if(?:n?def)?\b/).size()
            if (conditionalCount != text.findAll(/(?m)^\s*#endif\b/).size()) {
                throw new GradleException("GLSL compatibility check failed in ${source}: unbalanced preprocessor conditionals")
            }
            if (text.count("{") != text.count("}")) {
                throw new GradleException("GLSL compatibility check failed in ${source}: unbalanced braces")
            }
        }

        def generatedShaderSources = [
                file("src/main/java/com/y271727uy/lumenized/client/light/LightManager.java"),
                file("src/main/java/com/y271727uy/lumenized/client/postprocessing/PostProcessing.java"),
                file("src/main/java/com/y271727uy/lumenized/comp/iris/ShaderpackInjections.java")
        ]
        generatedShaderSources.each { source ->
            if (!source.exists()) return
            def text = source.getText("UTF-8")
            [
                    [name: "legacy texture2D", pattern: /\btexture2D\s*\(/],
                    [name: "legacy fragment output", pattern: /\bgl_FragColor\b/],
                    [name: "legacy vertex qualifier", pattern: /\b(attribute|varying)\b/],
                    [name: "C-style float suffix", pattern: /\b\d+\.\d+f\b/],
                    [name: "leading decimal literal", pattern: /(?<![0-9A-Za-z_.])\.[0-9]+/]
            ].each { rule ->
                if (text.find(rule.pattern)) {
                    throw new GradleException("Generated GLSL compatibility check failed in ${source}: ${rule.name}")
                }
            }
        }
    }
}

tasks.named("processResources").configure {
    dependsOn tasks.named("validateGlslCompatibility")
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named("extractSodiumMod")
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll([
        '-AdisableTargetValidator=true'
    ])
}
tasks.matching { it.name == "runClient" || it.name == "runServer" }.configureEach {
    dependsOn tasks.named("extractSodiumMod")
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
